<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - BlogSpace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="navbar">
      <a class="logo" href="index.html">◈ BlogSpace</a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle color theme"
        >
          ☀️
        </button>
      </nav>
    </header>

    <main class="account-page">
      <a class="back" href="index.html">← Back to posts</a>

      <div class="account-heading">
        <span class="eyebrow">WELCOME TO BLOGSPACE</span>
        <h1>Your account</h1>
        <p>Join the community and start sharing your ideas.</p>
      </div>

      <div class="account-grid">
        <section class="account-card">
          <div class="account-icon">✦</div>
          <h2>Create an account</h2>
          <p class="muted">New here? Join our community.</p>

          <form id="signup-form">
            <label>
              Username
              <input name="username" required placeholder="Enter username" />
            </label>

            <label>
              Email
              <input name="email" type="email" placeholder="Enter email" />
            </label>

            <label>
              Password
              <input
                name="password"
                type="password"
                minlength="8"
                required
                placeholder="Minimum 8 characters"
              />
            </label>

            <button type="submit">Create account</button>
          </form>

          <p id="signup-message" aria-live="polite"></p>
        </section>

        <section class="account-card">
          <div class="account-icon">↗</div>
          <h2>Welcome back</h2>
          <p class="muted">Already have an account? Log in.</p>

          <form id="login-form">
            <label>
              Username
              <input name="username" required placeholder="Enter username" />
            </label>

            <label>
              Password
              <input
                name="password"
                type="password"
                required
                placeholder="Enter password"
              />
            </label>

            <button type="submit">Log in</button>
          </form>

          <p id="login-message" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <script src="account.js"></script>
  </body>
</html>
